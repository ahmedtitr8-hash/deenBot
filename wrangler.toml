name = "deen-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# متغيرات عامة (غير سرية) - عدّلها حسب مشروعك
[vars]
FIREBASE_PROJECT_ID = "deenbot-a400c"
DEFAULT_CITY = "Riyadh"
DEFAULT_COUNTRY = "Saudi Arabia"

# الأسرار (تُضاف عبر: wrangler secret put <NAME>) وليس هنا:
# - BOT_TOKEN            (توكن بوت تليجرام)
# - FIREBASE_CLIENT_EMAIL (من ملف service account)
# - FIREBASE_PRIVATE_KEY  (من ملف service account)
# - WEBHOOK_SECRET        (سلسلة عشوائية لحماية الـ webhook)

# تشغيل مجدول: أذكار الصباح (٥ ص UTC) والمساء (٣ عصرًا UTC) + فحص تذكيرات الصلاة كل ١٠ دقائق
[triggers]
crons = ["0 5 * * *", "0 15 * * *", "*/10 * * * *"]
