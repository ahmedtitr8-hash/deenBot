workflows:
  android-apk:
    name: Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups: []
    scripts:
      - name: Generate android folder
        script: flutter create . --platforms=android --org com.noor --project-name noor
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.apk
